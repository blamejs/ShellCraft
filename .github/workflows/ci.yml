name: CI

# Runs `cargo xtask ci` on Linux, macOS and Windows for every push to main and every pull request,
# through the suite's shared gate workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request branch cancels its older run; every push to main runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Pinned to craft-common-actions main at 2026-11-23T04:18Z; move the pin to take later changes.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@ddb472330fe7eff2c5a77ffb551bf119a868f3d3
    with:
      timeout-minutes: 90
      os: '["ubuntu-24.04","macos-latest","windows-latest"]'
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libxcursor-dev
        libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
        libgbm-dev libegl-dev
